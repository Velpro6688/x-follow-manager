<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=360, initial-scale=1">
  <title>X 关注管理台</title>
  <script src="shared/tokens.js"></script>
  <script src="shared/theme-init.js"></script>
  <script src="shared/i18n.js"></script>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app">
    <header class="head">
      <span class="mark" aria-hidden="true"></span>
      <h1 data-i18n="popup.title">X 关注管理台</h1>
      <span class="ver">v1.0.0</span>
    </header>

    <section class="status" id="stateCard" data-tone="">
      <div class="status-top">
        <span class="dot" id="dot"></span>
        <strong id="stateTitle">正在检查当前页面…</strong>
        <span class="chip" id="modeChip" hidden>关注清理</span>
      </div>
      <p class="desc" id="stateDesc">请稍候</p>
      <p class="hint" id="scanHint" hidden>扫描期间请保持此标签页可见；窗口被完全覆盖时浏览器会暂停页面，扫描会停止。</p>
      <div class="bar" id="progress" hidden><i id="progressBar"></i></div>
    </section>

    <section class="stats" id="stats" hidden aria-label="当前统计">
      <div><span data-i18n="popup.stats.scanned">已扫描</span><b id="sTotal">0</b></div>
      <div class="key"><span id="labOneWay">未回关</span><b id="sOneWay">0</b></div>
      <div><span data-i18n="popup.stats.selected">已选</span><b id="sSelected">0</b></div>
      <div><span data-i18n="popup.stats.unknown">未知</span><b id="sUnknown">0</b></div>
      <div><span data-i18n="popup.stats.excluded">已排除</span><b id="sExcluded">0</b></div>
    </section>

    <section class="actions">
      <button id="rosterBtn" class="btn primary" hidden data-i18n="popup.roster">查看名单并挑选</button>
      <div class="split">
        <button id="focusBtn" class="btn" hidden data-i18n="popup.focus">定位面板</button>
        <button id="stopBtn" class="btn stop" hidden data-i18n="popup.stop">停止任务</button>
      </div>
      <button id="reloadBtn" class="btn" hidden data-i18n="popup.reload">刷新页面以启用</button>
    </section>

    <section class="settings">
      <div class="sec-title" data-i18n="popup.settings">设置</div>
      <p id="settingsError" class="tip" role="status" data-i18n="popup.saveFailed" hidden>设置保存失败，请重试。</p>

      <div class="row">
        <label for="langInput" data-i18n="popup.language">界面语言</label>
        <select id="langInput" class="lang">
          <option value="auto" data-i18n="popup.langAuto">自动（跟随浏览器）</option>
          <option value="zh">简体中文</option>
          <option value="en">English</option>
          <option value="ja">日本語</option>
          <option value="ko">한국어</option>
          <option value="de">Deutsch</option>
          <option value="fr">Français</option>
          <option value="es">Español</option>
          <option value="pt">Português</option>
          <option value="ru">Русский</option>
        </select>
      </div>

      <div class="row">
        <label for="limitInput" data-i18n="popup.limit">单批上限</label>
        <div class="num">
          <input type="number" id="limitInput" min="1" max="200" step="1" value="50" inputmode="numeric">
          <span>个</span>
        </div>
      </div>

      <div class="row">
        <label class="check" for="strictInput">
          <input type="checkbox" id="strictInput">
          <span data-i18n="popup.strict">严格校验</span>
        </label>
      </div>
      <p class="tip">开启后，若整页没有任何「关注了你」标记，或超过一半账号无法判定，将禁止批量执行。</p>

      <div class="row">
        <label class="check" for="debugInput">
          <input type="checkbox" id="debugInput">
          <span data-i18n="popup.debug">调试日志</span>
        </label>
      </div>
      <p class="tip">默认关闭；开启后可在 X 页面控制台执行 __xfmLogs 查看定位与判定记录。</p>

      <div class="row">
        <span class="meta"><span data-i18n="popup.excluded">排除名单</span> <b id="excludedCount">0</b> <span data-i18n="popup.unit">个</span></span>
        <button id="clearExcludedBtn" class="btn link" hidden>清空</button>
      </div>
      <p class="tip">右键或 Alt+点击复选框可排除账号；页面面板的「排除」按钮可切换成单击即排除。</p>

      <div class="foot">
        <button id="resetBtn" class="btn link" data-i18n="popup.reset">恢复默认</button>
        <span class="meta dim">设置仅存本机</span>
      </div>
    </section>
  </div>
  <script src="popup.js"></script>
</body>
</html>
